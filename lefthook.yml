# Two jobs per workspace, not one, for two independent reasons.
#
# 1. Scope. `npx ultracite fix` with no file arguments formats the WHOLE repo,
#    so committing one file silently rewrites unrelated files in the working
#    tree. Passing {staged_files} keeps the fixer to what is being committed.
#
# 2. Empty sets. `ultracite fix` runs oxfmt then oxlint, and oxlint exits
#    non-zero when handed no lintable files. Globbing json/css into the same
#    job as ts/tsx would therefore fail any JSON-only commit — which is exactly
#    what the changesets bot produced for "Version Packages" back when this repo
#    still released. So lint only what oxlint can lint, and format the rest
#    with oxfmt directly.
#
# md/mdx are absent from every glob on the same reasoning: neither tool handles
# markdown, so a docs-only commit would hit the identical empty-set failure.
#
# Run tools in the engine workspace where their configs live.
#
# Foundry configuration guards below also cover the root configuration invariants.
pre-commit:
  parallel: true
  jobs:
    - name: dead code
      run: npm run check:dead
    - name: foundry configuration
      run: npm run check:foundry
    - name: ultracite (cli)
      root: "packages/iconsmith/"
      glob: "*.{js,jsx,ts,tsx}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true
    - name: oxfmt (cli)
      root: "packages/iconsmith/"
      glob: "*.{json,jsonc,css}"
      # oxfmt ignores lockfiles, and exits non-zero when every file it is given
      # is ignored, so a lockfile-only commit would fail the hook. The same is
      # true of the workbench's records: `oxfmt.config.ts` ignores them because
      # `backlog.mjs` writes them and the two formats disagree by construction,
      # so a commit of one generation run is a commit of nothing this job can
      # format. Excluded here as well, so the job is skipped rather than starved.
      # `bench/` is the same case a third time: every file there is a committed
      # golden artifact written by a script with `JSON.stringify(_, null, 2)`,
      # so `oxfmt.config.ts` ignores it — and a commit of one measurement run is
      # a commit of nothing this job can format. Running `judge-gate.ts` and
      # committing its verdict alone would otherwise starve the job.
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
        - "workbench/*/explorations/**"
        - "**/workbench/*/explorations/**"
        - "workbench/*/campaign.json"
        - "**/workbench/*/campaign.json"
        - "bench/*.json"
        - "**/bench/*.json"
        - "library/blode-icons/**"
        - "**/library/blode-icons/**"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true

    # Whole-repo, not {staged_files}: a layering violation is a property of the
    # import graph, so checking only the staged half would miss the edge that
    # the staged file just created.
    - name: boundaries
      root: "packages/iconsmith/"
      glob: "*.{ts,tsx}"
      run: node scripts/check-boundaries.ts
