# Two jobs per workspace, not one, for two independent reasons.
#
# 1. Scope. `npx ultracite fix` with no file arguments formats the WHOLE repo,
#    so committing one file silently rewrites unrelated files in the working
#    tree. Passing {staged_files} keeps the fixer to what is being committed.
#
# 2. Empty sets. `ultracite fix` runs oxfmt then oxlint, and oxlint exits
#    non-zero when handed no lintable files. Globbing json/css into the same
#    job as ts/tsx would therefore fail any JSON-only commit, which is exactly
#    what the changesets bot produces for "Version Packages", breaking the
#    release workflow. So lint only what oxlint can lint, and format the rest
#    with oxfmt directly.
#
# md/mdx are absent from every glob on the same reasoning: neither tool handles
# markdown, so a docs-only commit would hit the identical empty-set failure.
#
# The jobs are scoped per workspace with `root:` because each workspace has its
# own oxlint.config.ts and oxfmt.config.ts, and the tools resolve those from the
# working directory. Running them once from the repo root would silently apply
# the wrong preset to one of the two: the CLI has no react or next rules, the
# web app needs both. Lefthook skips a job whose root matches no staged file, so
# a commit touching only one workspace still runs only one pair.
#
# Known gap, and the same one blode-co carries: files at the repo root itself
# (turbo.json, the root package.json, .changeset/config.json) are covered by no
# job here, and `turbo check` does not reach them either.
pre-commit:
  parallel: true
  jobs:
    - name: ultracite (cli)
      root: "packages/iconsmith/"
      glob: "*.{js,jsx,ts,tsx}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true
    - name: oxfmt (cli)
      root: "packages/iconsmith/"
      glob: "*.{json,jsonc,css}"
      # oxfmt ignores lockfiles, and exits non-zero when every file it is given
      # is ignored, so a lockfile-only commit would fail the hook. The same is
      # true of the workbench's records: `oxfmt.config.ts` ignores them because
      # `backlog.mjs` writes them and the two formats disagree by construction,
      # so a commit of one generation run is a commit of nothing this job can
      # format. Excluded here as well, so the job is skipped rather than starved.
      # `bench/` is the same case a third time: every file there is a committed
      # golden artifact written by a script with `JSON.stringify(_, null, 2)`,
      # so `oxfmt.config.ts` ignores it — and a commit of one measurement run is
      # a commit of nothing this job can format. Running `judge-gate.ts` and
      # committing its verdict alone would otherwise starve the job.
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
        - "workbench/*/explorations/**"
        - "**/workbench/*/explorations/**"
        - "workbench/*/campaign.json"
        - "**/workbench/*/campaign.json"
        - "bench/*.json"
        - "**/bench/*.json"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true

    - name: ultracite (web)
      root: "apps/web/"
      glob: "*.{js,jsx,ts,tsx}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true
    - name: oxfmt (web)
      root: "apps/web/"
      glob: "*.{json,jsonc,css}"
      # `lib/campaign.json` and `lib/vocabulary.json` are projections their
      # scripts rewrite; `oxfmt.config.ts` ignores them for the same reason the
      # lockfile is ignored, and an all-ignored set exits non-zero.
      # `house-icons.json` moved to `apps/agent/lib/` with `arsenal.ts`, which
      # reads it, and is excluded by that workspace's job below.
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
        - "lib/campaign.json"
        - "lib/vocabulary.json"
        - "lib/studio/campaign.json"
        - "**/lib/campaign.json"
        - "**/lib/vocabulary.json"
        - "**/lib/studio/campaign.json"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true

    - name: ultracite (agent)
      root: "apps/agent/"
      glob: "*.{js,jsx,ts,tsx}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true
    - name: oxfmt (agent)
      root: "apps/agent/"
      glob: "*.{json,jsonc,css}"
      # `lib/house-icons.json` is a projection `apps/web/scripts/house-data.mjs`
      # rewrites; the workspace config ignores it, and an all-ignored set exits
      # non-zero, so a commit that regenerated only the house snapshot would
      # starve this job rather than pass it.
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
        - "lib/house-icons.json"
        - "**/lib/house-icons.json"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true

    - name: ultracite (contract)
      root: "packages/contract/"
      glob: "*.{js,jsx,ts,tsx}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true
    - name: oxfmt (contract)
      root: "packages/contract/"
      glob: "*.{json,jsonc,css}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true

    # Whole-repo, not {staged_files}: a layering violation is a property of the
    # import graph, so checking only the staged half would miss the edge that
    # the staged file just created.
    - name: boundaries
      root: "packages/iconsmith/"
      glob: "*.{ts,tsx}"
      run: node scripts/check-boundaries.ts
