name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # CI has no private corpus. The receipt records measurements unavailable.
      # Local foundry verification requires the corpus by default.
      - name: Verify
        run: npm run verify -- --allow-missing-corpus
