name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # CI has no private corpus. The receipt records measurements unavailable.
      # Local foundry verification requires the corpus by default.
      - name: Verify
        run: npm run verify -- --allow-missing-corpus --out .staging/ci-verification

      - name: Public onboarding smoke (no credentials or corpus)
        run: npm run check:public

      - name: Show verification evidence
        if: always()
        run: |
          for log in .staging/ci-verification/*.log; do
            if [ -f "$log" ]; then
              printf '::group::%s\n' "$log"
              cat "$log"
              printf '::endgroup::\n'
            fi
          done
          if [ -f .staging/ci-verification/receipt.json ]; then
            cat .staging/ci-verification/receipt.json
          fi
