name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# pull-requests: write is not enough on its own. The repo must also enable
# Settings → Actions → General → "Allow GitHub Actions to create and approve
# pull requests". Without that, changesets/action versions changeset-release/main
# and then fails: "GitHub Actions is not permitted to create or approve pull
# requests."
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
